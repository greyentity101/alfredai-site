name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Required site files present
        run: |
          for f in index.html styles.css app.js; do test -f "$f" || { echo "missing $f"; exit 1; }; done

      - name: HTML parses cleanly
        run: python3 -c "from html.parser import HTMLParser; import pathlib; HTMLParser().feed(pathlib.Path('index.html').read_text(encoding='utf-8')); print('index.html OK')"
